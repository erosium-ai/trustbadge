<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Credentials AI small favicon mark — 16/32px derivative of V7 identity</title>
<desc id="desc">Simplified tiny-size derivative of the Credentials AI V7 identity for 16/32px favicon slots: glass card tile, large CA monogram, verified check badge.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF0B3"/>
    <stop offset="0.22" stop-color="#F6D77A"/>
    <stop offset="0.52" stop-color="#D4A843"/>
    <stop offset="0.78" stop-color="#8D681E"/>
    <stop offset="1" stop-color="#FFE9A0"/>
  </linearGradient>
  <linearGradient id="cardGlass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="rgba(255,255,255,0.30)"/>
    <stop offset="0.18" stop-color="rgba(14,24,58,0.97)"/>
    <stop offset="0.58" stop-color="rgba(3,7,22,0.99)"/>
    <stop offset="1" stop-color="rgba(8,14,36,0.95)"/>
  </linearGradient>
</defs>

<rect x="10" y="10" width="492" height="492" rx="120" fill="url(#cardGlass)" stroke="url(#gold)" stroke-width="22"/>

<text x="246" y="316" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="238" font-weight="900" text-anchor="middle" fill="#ffffff" stroke="rgba(0,0,0,0.45)" stroke-width="6" paint-order="stroke fill">CA</text>

<g transform="translate(392 396)">
  <circle cx="0" cy="0" r="96" fill="rgba(5,5,16,0.92)" stroke="rgba(255,232,160,1)" stroke-width="12"/>
  <path d="M-38 2 L-12 30 L46 -36" fill="none" stroke="#FFF0B3" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
