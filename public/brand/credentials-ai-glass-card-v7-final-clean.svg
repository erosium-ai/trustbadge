<svg viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Credentials AI glass credential card logo concept v7 final-clean-no-fade</title>
<desc id="desc">Transparent-background Credentials AI logo: straight glass credential card with gold glow, CA monogram, verified check, ABN QR signal, and text lockup underneath.</desc>
<defs>
  <filter id="cardShadow" x="-45%" y="-45%" width="190%" height="190%">
    <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.68"/>
  </filter>
  <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
    <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.83  0 1 0 0 0.66  0 0 1 0 0.26  0 0 0 1 0" result="gold"/>
    <feMerge><feMergeNode in="gold"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="whiteGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="floorGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>

  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF0B3"/>
    <stop offset="0.22" stop-color="#F6D77A"/>
    <stop offset="0.52" stop-color="#D4A843"/>
    <stop offset="0.78" stop-color="#8D681E"/>
    <stop offset="1" stop-color="#FFE9A0"/>
  </linearGradient>
  <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="rgba(255,240,179,0.94)"/>
    <stop offset="0.48" stop-color="rgba(212,168,67,0.78)"/>
    <stop offset="1" stop-color="rgba(255,255,255,0.22)"/>
  </linearGradient>
  <linearGradient id="cardGlass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="rgba(255,255,255,0.34)"/>
    <stop offset="0.18" stop-color="rgba(14,24,58,0.96)"/>
    <stop offset="0.58" stop-color="rgba(3,7,22,0.98)"/>
    <stop offset="1" stop-color="rgba(8,14,36,0.92)"/>
  </linearGradient>
  <radialGradient id="cardBloom" cx="50%" cy="30%" r="75%">
    <stop offset="0" stop-color="rgba(255,238,170,0.24)"/>
    <stop offset="0.55" stop-color="rgba(34,211,238,0.07)"/>
    <stop offset="1" stop-color="rgba(5,5,16,0)"/>
  </radialGradient>
</defs>

<!-- Transparent outer background: intended to sit on homepage/hero backgrounds -->

<!-- Ambient glow behind the mark only -->
<ellipse cx="450" cy="328" rx="350" ry="230" fill="rgba(212,168,67,0.08)" filter="url(#floorGlow)" opacity="0.95"/>
<ellipse cx="450" cy="445" rx="265" ry="34" fill="rgba(212,168,67,0.10)" filter="url(#floorGlow)" opacity="0.82"/>

<!-- Straight glass credential card -->
<g filter="url(#cardShadow)">
  <!-- rear thickness / glass depth -->
  <rect x="152" y="112" width="606" height="354" rx="48" fill="rgba(212,168,67,0.045)" stroke="rgba(212,168,67,0.22)" stroke-width="3" transform="translate(10 13)"/>

  <!-- main card -->
  <rect x="142" y="96" width="616" height="360" rx="50" fill="url(#cardGlass)" stroke="url(#gold)" stroke-width="7.4" filter="url(#goldGlow)"/>
  <rect x="158" y="112" width="584" height="328" rx="40" fill="url(#cardBloom)" stroke="rgba(255,255,255,0.18)" stroke-width="1.8"/>

  <!-- high glass reflection -->
  <path d="M186 124 H675 Q724 124 736 168" fill="none" stroke="url(#goldSoft)" stroke-width="4.2" stroke-linecap="round" opacity="0.90"/>
  <path d="M184 148 C309 124 507 123 712 153" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="20" stroke-linecap="round" opacity="0.52"/>

  <!-- CA monogram medallion -->
  <g transform="translate(208 160)">
    <circle cx="112" cy="112" r="106" fill="rgba(212,168,67,0.13)" stroke="rgba(255,218,126,0.82)" stroke-width="3.8" filter="url(#goldGlow)"/>
    <circle cx="112" cy="112" r="88" fill="rgba(3,5,16,0.88)" stroke="rgba(255,255,255,0.18)" stroke-width="1.6"/>
    <text x="112" y="130" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="101" font-weight="900" text-anchor="middle" fill="rgba(255,255,255,1)" stroke="rgba(0,0,0,0.38)" stroke-width="1.6" paint-order="stroke fill" filter="url(#whiteGlow)">CA</text>
    <path d="M57 179 C92 199 139 200 172 178" fill="none" stroke="rgba(212,168,67,0.72)" stroke-width="4.4" stroke-linecap="round" filter="url(#goldGlow)"/>
  </g>

  <!-- right credential text lines -->
  <g transform="translate(464 171)">
    <text x="0" y="0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850" letter-spacing="4.4" fill="rgba(255,232,160,1)" filter="url(#goldGlow)">VERIFIED</text>
    <text x="0" y="50" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="41" font-weight="900" letter-spacing="-1.1" fill="rgba(255,255,255,1)" filter="url(#whiteGlow)">Business ID</text>
    <text x="0" y="88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="3.1" fill="rgba(255,255,255,0.72)" filter="url(#whiteGlow)">AI-READABLE PROFILE</text>

    <line x1="0" y1="128" x2="206" y2="128" stroke="rgba(212,168,67,0.62)" stroke-width="2.3" stroke-linecap="round"/>
    <line x1="0" y1="158" x2="166" y2="158" stroke="rgba(255,255,255,0.31)" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="186" x2="216" y2="186" stroke="rgba(255,255,255,0.24)" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="214" x2="132" y2="214" stroke="rgba(255,255,255,0.24)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- verified check medallion -->
  <g transform="translate(690 154)" filter="url(#goldGlow)">
    <circle cx="0" cy="0" r="46" fill="rgba(212,168,67,0.22)" stroke="rgba(255,232,160,1)" stroke-width="4.6"/>
    <circle cx="0" cy="0" r="33" fill="rgba(5,5,16,0.62)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <path d="M-18 1 L-6 14 L22 -17" fill="none" stroke="#FFF0B3" stroke-width="9.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- QR / ABN signal block -->
  <g transform="translate(626 331)">
    <rect x="0" y="0" width="88" height="88" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(212,168,67,0.54)" stroke-width="2.3" filter="url(#goldGlow)"/>
    <g fill="rgba(255,232,160,0.86)">
      <rect x="14" y="14" width="14" height="14" rx="2"/><rect x="34" y="14" width="8" height="8" rx="1"/><rect x="56" y="14" width="18" height="18" rx="2"/>
      <rect x="14" y="36" width="8" height="8" rx="1"/><rect x="28" y="34" width="16" height="16" rx="2"/><rect x="52" y="42" width="8" height="8" rx="1"/><rect x="66" y="42" width="8" height="8" rx="1"/>
      <rect x="14" y="58" width="18" height="18" rx="2"/><rect x="42" y="58" width="8" height="8" rx="1"/><rect x="56" y="62" width="18" height="14" rx="2"/>
    </g>
    <text x="44" y="112" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="850" letter-spacing="2.2" fill="rgba(212,168,67,0.86)" text-anchor="middle" filter="url(#goldGlow)">ABN</text>
  </g>

  <!-- subtle circuit traces -->
  <g opacity="0.62" stroke="rgba(255,218,126,0.82)" stroke-linecap="round" fill="none" filter="url(#goldGlow)">
    <path d="M398 423 H530" stroke-width="1.7"/>
    <circle cx="530" cy="423" r="4.2" fill="rgba(212,168,67,0.58)" stroke="none"/>
  </g>

  <!-- tiny cyan anti-forgery / AI-search dot -->
</g>

<!-- Text lockup under the card -->
<g text-anchor="middle">
  <!-- Tight tagline: gap from card edge ≈ tagline font size -->
  <!-- Overboard readability pass: dark backing + heavy gold glow, same position -->
  <text x="450" y="496" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="950" letter-spacing="3.8" fill="none" stroke="rgba(0,0,0,0.96)" stroke-width="7.2" stroke-linejoin="round" text-anchor="middle" filter="url(#whiteGlow)">AI-READABLE PROFILES · 2026</text>
  <text x="450" y="496" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="950" letter-spacing="3.8" fill="#FFD66B" stroke="rgba(5,5,16,0.92)" stroke-width="2.2" paint-order="stroke fill" text-anchor="middle" filter="url(#goldGlow)">AI-READABLE PROFILES · 2026</text>
  <text x="450" y="496" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="950" letter-spacing="3.8" fill="rgba(255,246,204,0.34)" text-anchor="middle" filter="url(#goldGlow)">AI-READABLE PROFILES · 2026</text>
  <text x="450" y="585" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="76" font-weight="900" letter-spacing="-2.2" fill="rgba(255,255,255,0.99)" filter="url(#whiteGlow)">Credentials AI</text>
</g>
</svg>
